services:
  - type: web
    name: vivu-danang-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: SHEET_NAME
        value: vivu-danang-bot